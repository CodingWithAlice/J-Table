version: '3.1'
services:
  # MongoDB 服务
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - /data/mongodb:/data/db  # 挂载现有数据
    command: 
      - --bind_ip_all
    networks:
      - app-network
    # 如果不需要外部访问，可以只暴露给内部网络
    expose:
      - "27017"

  nestjs-server:
    build:
      context: .
      dockerfile: package/server/dockerfile
    ports:
      - "4002:4002"
    restart: always
    volumes:
      - ../config.env:/config.env
    depends_on:
      - mongodb  # 确保 MongoDB 先启动
    networks:
      - app-network

  react-client:
    build:
      context: .
      dockerfile: package/web/dockerfile
    ports:
      - "4001:4001"
    restart: always
    volumes:
      - ../config.env:/app/config.env
    depends_on:
      - nestjs-server  # 如果需要，可以添加这个依赖
    networks:
      - app-network

# 自定义网络，让服务可以通过服务名相互访问
networks:
  app-network:
    driver: bridge