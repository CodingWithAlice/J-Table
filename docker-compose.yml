version: '3.8'
services:

  nestjs-server:
    build:
      context: .
      dockerfile: package/server/dockerfile
    ports:
      - "4002:4002"
    restart: always
    volumes:
      - ../config.env:/config.env
    depends_on:
      - mongodb  # 确保 MongoDB 先启动
    networks:
      - app-network

  react-client:
    build:
      context: .
      dockerfile: package/web/dockerfile
    ports:
      - "4001:4001"
    restart: always
    volumes:
      - ../config.env:/app/config.env
    depends_on:
      - nestjs-server  # 如果需要，可以添加这个依赖
    networks:
      - app-network

# 自定义网络，让服务可以通过服务名相互访问
networks:
  app-network:
    driver: bridge